<section data-view="todos">
  <div class="view-head">
    <h1>TODOS &amp; LISTS</h1>
    <p class="view-sub">Shared errands, groceries, packing, house fixes, and tasks.</p>
  </div>

  <div class="paper">
    <div class="form-row">
      <input type="text" id="todoinput" class="text-input" placeholder="New task or list item..." maxlength="140">
      <select id="todocat" class="select-input">
        <option value="shared">shared</option>
        <option value="groceries">groceries</option>
        <option value="weekend">weekend</option>
        <option value="house">house</option>
        <option value="a" data-nameopt="a">Me</option>
        <option value="b" data-nameopt="b">JJ</option>
      </select>
      <button class="btn" id="todoaddbtn">ADD</button>
    </div>
    <div class="filter-row">
      <span class="sub">list:</span>
      <button class="chip on" data-todofilter="all">all</button>
      <button class="chip" data-todofilter="shared">shared</button>
      <button class="chip" data-todofilter="groceries">groceries</button>
      <button class="chip" data-todofilter="weekend">weekend</button>
      <button class="chip" data-todofilter="house">house</button>
      <button class="chip" data-todofilter="a" data-namechip="a">Me</button>
      <button class="chip" data-todofilter="b" data-namechip="b">JJ</button>
    </div>
  </div>

  <div class="todolist-container">
    <div id="todolist" class="todolist"></div>
    <div class="todo-footer-row">
      <button class="btn quiet" id="clearcompletedbtn">CLEAR COMPLETED</button>
    </div>
  </div>
</section>
