<section data-view="projects">
  <div class="view-head">
    <h1>PROJECT SPACES</h1>
    <p class="view-sub">Mini workspaces for music, trips, woodworking, builds, and joint plans.</p>
  </div>

  <div class="paper">
    <div class="form-grid">
      <input type="text" id="projecttitle" class="text-input" placeholder="Project name (e.g. Backyard Garden, Noodles Synth)...">
      <textarea id="projectdesc" class="textarea-input" rows="2" placeholder="Summary, notes, materials or next steps..."></textarea>
      <div style="display:flex;justify-content:flex-end;">
        <button class="btn" id="projectaddbtn">CREATE PROJECT</button>
      </div>
    </div>
  </div>

  <div id="projectlist" class="project-grid">
    <!-- Rendered dynamically -->
  </div>
</section>
